name: Build CrossCover Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing CrossCover tag on main (for example v1.5.0-crosscover.1)"
        required: true
        type: string
      version:
        description: "Version embedded in the firmware artifact names"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify tag belongs to main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch origin main --tags
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade \
            https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Build release environments
        env:
          CROSSPOINT_RELEASE_VERSION: ${{ inputs.version }}
        run: pio run -e tiny -e xlarge

      - name: Generate checksums
        run: |
          sha256sum \
            ".pio/build/tiny/firmware-tiny-v${{ inputs.version }}.bin" \
            ".pio/build/xlarge/firmware-xlarge-v${{ inputs.version }}.bin" \
            > "CrossCover-${{ inputs.version }}-SHA256SUMS.txt"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: CrossCover ${{ inputs.version }}
          generate_release_notes: true
          files: |
            .pio/build/tiny/firmware-tiny-v${{ inputs.version }}.bin
            .pio/build/xlarge/firmware-xlarge-v${{ inputs.version }}.bin
            CrossCover-${{ inputs.version }}-SHA256SUMS.txt
